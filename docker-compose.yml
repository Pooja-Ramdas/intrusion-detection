services:

  # ── HDFS ──────────────────────────────────────────────────────────────────
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    hostname: namenode
    restart: unless-stopped
    ports:
      - "9870:9870"   # HDFS Web UI
      - "9000:9000"   # HDFS RPC
    environment:
      CLUSTER_NAME: bda
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      CORE_CONF_hadoop_http_staticuser_user: root
      HDFS_CONF_dfs_replication: 2
      HDFS_CONF_dfs_blocksize: 134217728         # 128 MiB blocks
      HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check: "false"
    volumes:
      - namenode_data:/hadoop/dfs/name
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    mem_limit: 640m
    cpus: 0.50

  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode1
    hostname: datanode1
    restart: unless-stopped
    depends_on:
      namenode:
        condition: service_healthy
    environment:
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: 2
      HDFS_CONF_dfs_blocksize: 134217728
      HDFS_CONF_dfs_datanode_du_reserved: 5368709120
      HDFS_CONF_dfs_datanode_data_dir: file:///hadoop/dfs/data
    volumes:
      - datanode1_data:/hadoop/dfs/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9864"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    mem_limit: 768m
    cpus: 0.50

  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode2
    hostname: datanode2
    restart: unless-stopped
    depends_on:
      namenode:
        condition: service_healthy
    environment:
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: 2
      HDFS_CONF_dfs_blocksize: 134217728
      HDFS_CONF_dfs_datanode_du_reserved: 5368709120
      HDFS_CONF_dfs_datanode_data_dir: file:///hadoop/dfs/data
    volumes:
      - datanode2_data:/hadoop/dfs/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9864"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    mem_limit: 768m
    cpus: 0.50

  # ── Spark Standalone ──────────────────────────────────────────────────────
  spark-master:
    image: bda-spark:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.spark
    container_name: spark-master
    hostname: spark-master
    restart: unless-stopped
    ports:
      - "8080:8080"   # Spark Web UI
      - "7077:7077"   # Spark master RPC
      - "4040:4040"   # Spark application UI (first job)
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_LOCAL_DIRS: /spark-tmp
    command: >
      /bin/bash -c "
        /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
        --host spark-master --port 7077 --webui-port 8080
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    cpus: 0.25

  spark-worker-1:
    image: bda-spark:latest
    container_name: spark-worker-1
    hostname: spark-worker-1
    restart: unless-stopped
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-700m}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-1}
      SPARK_LOCAL_DIRS: /spark-tmp
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "--memory", "${SPARK_WORKER_MEMORY:-700m}", "--cores", "${SPARK_WORKER_CORES:-1}", "spark://spark-master:7077"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 896m
    cpus: 1.00

  spark-worker-2:
    image: bda-spark:latest
    container_name: spark-worker-2
    hostname: spark-worker-2
    restart: unless-stopped
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-700m}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-1}
      SPARK_LOCAL_DIRS: /spark-tmp
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "--memory", "${SPARK_WORKER_MEMORY:-700m}", "--cores", "${SPARK_WORKER_CORES:-1}", "spark://spark-master:7077"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 896m
    cpus: 1.00


  # ── MongoDB ───────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: mongodb
    hostname: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    command: ["mongod", "--wiredTigerCacheSizeGB", "2"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    mem_limit: 2560m
    cpus: 1.25

  # ── Streamlit Dashboard ───────────────────────────────────────────────────
  app:
    image: bda-spark:latest
    container_name: app
    hostname: app
    restart: unless-stopped
    ports:
      - "8501:8501"
    depends_on:
      spark-master:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    volumes:
      - ./artifacts:/artifacts:ro
      - ./app:/app:ro
      - ${BDA_ROOT:-D:/bda}/logs/profile/phase2_v1/csv:/profile:ro
      - ${BDA_ROOT:-D:/bda}/_meta/results:/results:ro
      - ${BDA_ROOT:-D:/bda}/_meta/profile/EDA:/graphs:ro
    environment:
      MONGO_URI: mongodb://mongodb:27017
      BDA_PROFILE_DIR: /profile
    command: >
      streamlit run /app/app.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.headless true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 640m
    cpus: 0.50

volumes:
  namenode_data:
    name: bda_namenode_data
  datanode1_data:
    name: bda_datanode1_data
  datanode2_data:
    name: bda_datanode2_data
  mongo_data:
    name: bda_mongo_data
